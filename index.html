<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontre a vaga ideal para o seu perfil e descubra o que estudar para se destacar.">
    <title>SkillMatch | Encontre sua Vaga Ideal</title>
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>

    <header>
        <img src="assets/img/logo.svg" alt="Logo SkillMatch">
        <h1>SkillMatch</h1>
    </header>

    <main>
        <!-- Seção 1: Formulário -->
        <section>
            <h2>Preencha seu perfil</h2>
            <form id="candidate-form">
                <!--Campo Nome-->
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Maria da Silva">
                </div>

                <!-- Campo Área de Atuação -->
                 <div class="form-group">
                    <label for="area">Área de atuação</label>
                    <select id="area" name="area" required>
                        <option value="">Selecione uma área</option>
                        <option value="front-end">Front-End</option>
                        <option value="back-end">Back-End</option>
                        <option value="dados">Dados</option>
                    </select>
                 </div>

                 <!-- Campo Habilidades -->
                  <div class="form-group">
                    <label for="habilidades">Habilidades</label>
                    <input type="text" name="habilidades" id="habilidades" placeholder="Ex: HTML, CSS, JavaScript..." required>
                    <small>Separe as habilidades por vírgula.</small>
                  </div>

                  <!-- Campo Experiência -->
                   <div class="form-group">
                    <label for="experiencia">Experiência em meses</label>
                    <input type="number" name="experiencia" id="experiencia" placeholder="Ex: 8" required>
                   </div>

                   <!-- Botão de busca -->
                    <button type="submit">Buscar vagas ideais</button>

            </form>
        </section>

        <!-- Seção 2: Resultados -->
         <section id="resultados">
            <h2>Resultados</h2>

            <!--Área de Destaque-->
            <div id="destaque-vaga">
                <!--Aqui entra a melhor vaga via JS-->
            </div>

            <!--Lista de cards-->
            <div id="lista-vagas">
                <!--Os cards serão criados aqui-->
            </div>

         </section>
    </main>

    <footer>
        <p>Desenvolvido por Angélica Lorenz</p>
    </footer>



    <script type="module" src="assets/scripts/main.js"></script>    
</body>
</html>
